name: scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: HOL AI plugin scanner
        uses: hashgraph-online/ai-plugin-scanner-action@3220f5fedcd269533a6275738b2ab5d5f9753e8e # v1.2.811
        with:
          plugin_dir: "."
          online: "false"
          fail_on_severity: high

  quote-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Byte-compile
        run: python -m compileall -q skills
      - name: Quote check on the sample issues
        run: |
          for f in skills/distribute/sample/issues/*.json; do
            n=$(basename "$f" .json)
            python skills/distribute/scripts/check_posts.py \
              --source "skills/distribute/sample/sources/$n.txt" --posts "$f"
          done
