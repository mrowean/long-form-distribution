name: scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: HOL AI plugin scanner
        uses: hashgraph-online/ai-plugin-scanner-action@2e02b602733702f72a5e9b7182b6c6b74743ceb5 # v1.2.780
        with:
          plugin_dir: "."
          online: "false"
          fail_on_severity: high

  quote-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Byte-compile
        run: python -m compileall -q skills
      - name: Quote check on the sample issues
        run: |
          for f in skills/distribute/sample/issues/*.json; do
            n=$(basename "$f" .json)
            python skills/distribute/scripts/check_posts.py \
              --source "skills/distribute/sample/sources/$n.txt" --posts "$f"
          done
