name: scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: HOL AI plugin scanner
        uses: hashgraph-online/ai-plugin-scanner-action@2e02b602733702f72a5e9b7182b6c6b74743ceb5 # v1.2.780
        with:
          plugin_dir: "."
          online: "false"
          fail_on_severity: high

  quote-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Byte-compile
        run: python -m compileall -q skills
      - name: Quote check on the sample issues
        run: |
          for f in skills/distribute/sample/issues/*.json; do
            n=$(basename "$f" .json)
            python skills/distribute/scripts/check_posts.py \
              --source "skills/distribute/sample/sources/$n.txt" --posts "$f"
          done
